<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <!-- Phone Body with Titanium Gold border -->
  <rect x="25" y="10" width="50" height="80" rx="12" fill="url(#phoneBody)" stroke="url(#goldRim)" stroke-width="2.5"/>
  <!-- Screen -->
  <rect x="28" y="13" width="44" height="74" rx="9" fill="url(#screenGrad)"/>
  <!-- Dynamic Island -->
  <rect x="42" y="16" width="16" height="5" rx="2.5" fill="#000000"/>
  <!-- Camera bump on reverse (or subtle brand accent) -->
  <circle cx="50" cy="50" r="10" fill="#000000" fill-opacity="0.3"/>
  <text x="50" y="54" font-family="Arial, sans-serif" font-weight="900" font-size="10" fill="#ffffff" text-anchor="middle">17</text>
  <text x="50" y="66" font-family="Arial, sans-serif" font-weight="700" font-size="6" fill="#fde047" text-anchor="middle">PRO MAX</text>
</svg>
